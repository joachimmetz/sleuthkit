name: test_docker
on: [push]
permissions: read-all
jobs:
  test_fedora:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        fedora_version:
        - '40'
        - '42'
        - '44'
        sleuthkit_version:
        - '4.10.0'
        - '4.10.1'
        - '4.10.2'
        - '4.11.0'
        - '4.11.1'
        - '4.12.0'
        - '4.13.0'
        - '4.14.0'
        - '4.15.0'
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora_version }}
    steps:
    - name: Set up container
      run: |
        dnf install -y dnf-plugins-core langpacks-en
    - name: Install build dependencies
      run: |
        dnf install -y @development-tools autoconf automake gcc-c++ git libtool pkg-config
    - name: Build source
      env:
        LANG: C.utf8
      run: |
        git clone https://github.com/sleuthkit/sleuthkit.git
        cd sleuthkit
        git checkout sleuthkit-${{ matrix.sleuthkit_version }}
        ./bootstrap
        ./configure
        make
        tools/fstools/fls -V

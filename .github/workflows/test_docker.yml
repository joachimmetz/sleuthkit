name: test_docker
on: [push]
permissions: read-all
jobs:
  test_fedora:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        version: ['4.15.0', '4.14.0']
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
    - name: Set up container
      run: |
        dnf install -y dnf-plugins-core langpacks-en
    - name: Install build dependencies
      run: |
        dnf install -y @development-tools autoconf automake gcc-c++ git libtool pkg-config
    - name: Build source
      env:
        LANG: C.utf8
      run: |
        git clone https://github.com/sleuthkit/sleuthkit.git
        cd sleuthkit
        git checkout sleuthkit-${{ matrix.version }}
        ./bootstrap
        ./configure
        make

# Run source checks.
name: source_checks
on:
  pull_request:
  push:
permissions: read-all
jobs:
  asan:
    name: Check source with asan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Install build dependencies
      run: |
        sudo apt -y install autoconf automake autopoint build-essential git libasan8 libtool pkg-config unzip wget
    - name: Download test file
      run: |
        wget -O 2-kwsrch-fat.zip "http://prdownloads.sourceforge.net/dftt/2-kwsrch-fat.zip?download"
        wget -O 3-kwsrch-ntfs.zip "http://prdownloads.sourceforge.net/dftt/3-kwsrch-ntfs.zip?download"
        wget -O 4-kwsrch-ext3.zip "http://prdownloads.sourceforge.net/dftt/4-kwsrch-ext3.zip?download"
        unzip 2-kwsrch-fat.zip
        unzip 3-kwsrch-ntfs.zip
        unzip 4-kwsrch-ext3.zip
        mkdir -p ${HOME}/from_brian
        mv 2-kwsrch-fat/fat-img-kw.dd ${HOME}/from_brian/
        mv 3-kwsrch-ntfs/ntfs-img-kw-1.dd ${HOME}/from_brian
        mv 4-kwsrch-ext3/ext3-img-kw-1.dd ${HOME}/from_brian/
    - name: Building from source
      env:
        CFLAGS: "-fno-omit-frame-pointer -fsanitize=address -g -O0"
        CXXFLAGS: "-fsanitize=address -g -O0"
        LDFLAGS: "-fsanitize=address"
      run: |
        ./bootstrap
        ./configure --disable-java CFLAGS="${CFLAGS}" CXXFLAGS="${CXXFLAGS}" LDFLAGS="${LDFLAGS}"
        make >/dev/null
    - name: Run tests
      run: |
        ./runtests.sh
  ubsan:
    name: Check source with ubsan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Install build dependencies
      run: |
        sudo apt -y install autoconf automake autopoint build-essential git libtool libubsan1 pkg-config unzip wget
    - name: Download test file
      run: |
        wget -O 2-kwsrch-fat.zip "http://prdownloads.sourceforge.net/dftt/2-kwsrch-fat.zip?download"
        wget -O 3-kwsrch-ntfs.zip "http://prdownloads.sourceforge.net/dftt/3-kwsrch-ntfs.zip?download"
        wget -O 4-kwsrch-ext3.zip "http://prdownloads.sourceforge.net/dftt/4-kwsrch-ext3.zip?download"
        unzip 2-kwsrch-fat.zip
        unzip 3-kwsrch-ntfs.zip
        unzip 4-kwsrch-ext3.zip
        mkdir -p ${HOME}/from_brian
        mv 2-kwsrch-fat/fat-img-kw.dd 3-kwsrch-ntfs/ntfs-img-kw-1.dd 4-kwsrch-ext3/ext3-img-kw-1.dd ${HOME}/from_brian
    - name: Building from source
      env:
        CFLAGS: "-fsanitize=undefined -fno-sanitize-recover=undefined"
        CXXFLAGS: "-fsanitize=undefined -fno-sanitize-recover=undefined"
        LDFLAGS: "-fsanitize=undefined"
      run: |
        ./bootstrap
        ./configure --disable-java CFLAGS="${CFLAGS}" CXXFLAGS="${CXXFLAGS}" LDFLAGS="${LDFLAGS}"
        make >/dev/null
    - name: Run tests
      run: |
        ./runtests.sh
  scan_build:
    name: Scan Build and Upload
    runs-on: ubuntu-latest
    permissions:
      # Required to upload to GitHub Code Scanning
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Install build dependencies
      run: |
        sudo apt -y install autoconf automake autopoint build-essential clang clang-tools git libtool pkg-config
    - name: Run scan-build
      run: |
        ./bootstrap
        ./configure --disable-java
        scan-build -o scan-results -sarif make
    - name: Combine individual SARIF files
      run: |
        npx @microsoft/sarif-multitool merge scan-results/*/*.sarif --merge-runs --output-file=scan-build-report.sarif
    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: scan-build-report.sarif
        category: scan-build
  scan_build_msys2_mingw:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up MSYS2 with MinGW-w64
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: autoconf automake curl gettext gettext-devel git libtool make mingw-w64-x86_64-clang-analyzer mingw-w64-x86_64-nodejs pkg-config
    - name: Build from source
      shell: msys2 {0}
      run: |
        ./bootstrap
        ./configure --disable-java
        scan-build -o scan-results -sarif make
    - name: Combine individual SARIF files
      shell: msys2 {0}
      run: |
        npx @microsoft/sarif-multitool merge scan-results/*/*.sarif --merge-runs --output-file=scan-build-report.sarif
    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: scan-build-report.sarif
        category: scan-build
